application:
  name: bold-lake-freecodecamp
  pods:
    - name: client
      image: "# filled by pipeline"
      servicePorts:
        - 8000
      vars:
        NODE_ENV: "production"
    - name: api
      image: "# filled by pipeline"
      servicePorts:
        - 3000
      vars:
        PORT: "3000"
        MONGOHQ_URL: "mongodb://${mongodb:27017}/freecodecamp"
    - name: mongodb
      image: mirror.gcr.io/library/mongo:7
      servicePorts:
        - 27017